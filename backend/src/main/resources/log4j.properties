# Root logger option
log4j.rootLogger=WARN, stdout, file

log4j.logger.com.example.forksup=INFO
log4j.logger.org.springframework=WARN
log4j.logger.org.mongodb=WARN

# Configure stdout Appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Configure file Appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=./logs/forksup.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


# Review Log
log4j.logger.reviewLogger=INFO, reviewFile
log4j.additivity.reviewLogger=false

log4j.appender.reviewFile=org.apache.log4j.RollingFileAppender
log4j.appender.reviewFile.File=logs/reviews.log
log4j.appender.reviewFile.MaxFileSize=5MB
log4j.appender.reviewFile.MaxBackupIndex=5
log4j.appender.reviewFile.layout=org.apache.log4j.PatternLayout
log4j.appender.reviewFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
